 
<div>
  <div class="mb-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div>
      <div class="page-title">Appointments Calendar</div>
      <div class="page-subtitle">Visual month view of all appointments</div>
    </div>
    <a routerLink="/appointments" class="btn-cancel-sm">
      <i class="bi bi-list-ul"></i> List View
    </a>
  </div>
 
  <div class="card">
    <div class="card-header bg-white d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div class="form-card-title"><i class="bi bi-calendar3"></i> {{ monthLabel }}</div>
      <div class="cal-nav">
        <button type="button" class="act-btn act-view" (click)="prevMonth()">
          <i class="bi bi-chevron-left"></i>
        </button>
        <button type="button" class="act-btn act-edit" (click)="goToday()">Today</button>
        <button type="button" class="act-btn act-view" (click)="nextMonth()">
          <i class="bi bi-chevron-right"></i>
        </button>
      </div>
    </div>
 
    <div class="card-body p-3">
 
      <div *ngIf="isLoading" class="cal-loading">
        <i class="bi bi-hourglass-split"></i> Loading appointments...
      </div>
 
      <div class="cal-grid" *ngIf="!isLoading">
        <div class="cal-weekday" *ngFor="let d of weekdayLabels">{{ d }}</div>
 
        <ng-container *ngFor="let week of weeks">
          <div class="cal-day"
               *ngFor="let day of week"
               [class.cal-day-out]="!day.inMonth"
               [class.cal-day-today]="day.isToday"
               (click)="addAppointment(day)">
 
            <div class="cal-day-top">
              <span class="cal-day-num">{{ day.date.getDate() }}</span>
              <i class="bi bi-plus-circle cal-add-icon"
                 *ngIf="permissionService.canCreate('Appointments')"
                 title="Add appointment"></i>
            </div>
 
            <div class="cal-chips">
              <div class="cal-chip"
                   *ngFor="let appt of day.appointments"
                   [ngClass]="statusClass(appt.status)"
                   (click)="openAppointment(appt, $event)"
                   [title]="appt.patientName + ' - ' + appt.appointmentTime">
                <span class="cal-chip-time">{{ appt.appointmentTime }}</span>
                <span class="cal-chip-name">{{ appt.patientName }}</span>
              </div>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
