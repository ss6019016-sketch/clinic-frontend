<div class="notif-wrapper">
  <button class="notif-btn" (click)="toggle()">
    <i class="bi bi-bell-fill"></i>
    <span class="notif-badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>
  </button>

  <div class="notif-dropdown" *ngIf="isOpen">
    <div class="notif-header">
      <span>Notifications</span>
      <button (click)="markAllRead()" *ngIf="unreadCount > 0">Mark all read</button>
    </div>
    <div class="notif-list">
      <div *ngFor="let n of notifications" class="notif-item" [class.unread]="!n.isRead" (click)="onClickNotification(n)">
        <i class="bi" [ngClass]="getIcon(n.type)"></i>
        <div>
          <div class="notif-title">{{ n.title }}</div>
          <div class="notif-message">{{ n.message }}</div>
          <div class="notif-time">{{ n.createdAt | date:'MMM d, h:mm a' }}</div>
        </div>
      </div>
      <div *ngIf="notifications.length === 0" class="notif-empty">Koi notification nahi hai.</div>
    </div>
  </div>
</div>
